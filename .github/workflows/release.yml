name: release

on:
  push:
    tags:
      - "v*"

# Least privilege: only the release job may write; the jobs that run
# third-party install scripts (npm ci) get a read-only token.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt failed:"
            echo "$unformatted"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: screen
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web test
          npm --prefix web run build
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1 -race
      - name: release version guard
        run: |
          set -euo pipefail
          cli_version=$(go run ./cmd/kttn version | awk '{print $2}')
          npm_version=$(node -p "require('./package.json').version")
          if [ "$cli_version" != "$npm_version" ]; then
            echo "::error::CLI version $cli_version does not match package.json $npm_version"
            exit 1
          fi
          if [ "${GITHUB_ACTIONS:-}" = "true" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$npm_version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package version $npm_version"
              exit 1
            fi
          fi
      - name: npm package smoke
        run: |
          node -c bin/install.js
          sh -n bin/kttn
          npm pack --dry-run

  build:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: screen
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="dist/kttn_${version}_${GOOS}_${GOARCH}"
          mkdir -p "$out"
          go build -trimpath -ldflags "-s -w" -o "$out/kttn" ./cmd/kttn
          cp -R README.md LICENSE THIRD_PARTY_NOTICES.md licenses "$out/"
          tar -C dist -czf "${out}.tar.gz" "$(basename "$out")"
      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kttn_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.21.3
      - run: npm publish --access public
